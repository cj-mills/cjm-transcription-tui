[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cjm-transcription-tui"
version = "0.0.3"
description = "Transcription-workflow TUI driver: source/folder selection, candidate (capability, model)-instance setup from manifest config schemas, and per-segment side-by-side transcriber comparison to pick a run's lightweight/accuracy pair — then hands off to cjm-transcription-core's headless pipeline. Born on-graph."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Christian J. Mills", email = "9126128+cj-mills@users.noreply.github.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    'cjm-substrate-tui-kit>=0.0.1',
    'cjm-transcription-core>=0.0.5',
    'textual',
]

[project.scripts]
cjm-transcription-tui = "cjm_transcription_tui.cli:main"

[project.urls]
Repository = "https://github.com/cj-mills/cjm-transcription-tui"

[tool.setuptools.packages.find]
include = ["cjm_transcription_tui*"]
